# =============================================
# MySpace Production Configuration
# =============================================
# All secrets MUST come from environment variables.
# Never commit actual credentials. Use .env.example as template.
# =============================================

# Application
spring.application.name=productivity-backend
server.port=${PORT:8080}

# =============================================
# Google OAuth (REQUIRED)
# =============================================
google.client.id=${GOOGLE_CLIENT_ID}

# =============================================
# JWT Authentication (REQUIRED)
# =============================================
# Secret MUST be at least 64 characters for HS512
jwt.secret=${JWT_SECRET}
# Token expiration in milliseconds (default: 7 days = 604800000)
jwt.expiration.ms=${JWT_EXPIRATION_MS:604800000}

# =============================================
# Database - PostgreSQL (Production)
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:productivity_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =============================================
# JPA / Hibernate
# =============================================
# Use 'validate' in production after Flyway migrations are in place
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# =============================================
# Flyway Database Migrations
# =============================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# =============================================
# Jackson
# =============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# =============================================
# CORS (environment-based)
# =============================================
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# =============================================
# Email Configuration (optional)
# =============================================
mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:noreply@myspace.app}

# =============================================
# Actuator (health checks)
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
