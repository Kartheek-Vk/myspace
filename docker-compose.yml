version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: myspace-postgres
    environment:
      POSTGRES_DB: productivity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Spring Boot)
  backend:
    build:
      context: ./productivity-backend
      dockerfile: Dockerfile
    container_name: myspace-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=productivity_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET:-your-64-character-or-longer-secret-key-here-change-this-in-production-minimum-64-chars}
      - JWT_EXPIRATION_MS=604800000
      - FRONTEND_URL=http://localhost:5173
      - MAIL_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./productivity-app
      dockerfile: Dockerfile
    container_name: myspace-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
